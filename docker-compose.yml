services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  prediction-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: market_signal
      POSTGRES_USER: market_signal
      POSTGRES_PASSWORD: market_signal
    ports:
      - "5433:5432"
    volumes:
      - prediction_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U market_signal -d market_signal",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow:5000,localhost:*,127.0.0.1:*"
    image: python:3.11-slim
    command: >
      sh -c "pip install --no-cache-dir mlflow==3.15.2 psycopg2-binary &&
      mlflow server
      --host 0.0.0.0
      --port 5000
      --workers 1
      --backend-store-uri postgresql+psycopg2://mlflow:mlflow@postgres:5432/mlflow
      --artifacts-destination /mlartifacts"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlartifacts
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PREDICTION_DATABASE_URL: postgresql+psycopg://market_signal:market_signal@prediction-db:5432/market_signal
    ports:
      - "8000:8000"
    depends_on:
      prediction-db:
        condition: service_healthy
      mlflow:
        condition: service_started

volumes:
  postgres_data:
  mlflow_artifacts:
  prediction_data: