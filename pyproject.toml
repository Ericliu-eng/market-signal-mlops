[project]
name = "market-signal-mlops"
version = "0.1.0"
description = "Production-style financial MLOps platform for market signal modeling."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "mlflow>=2.0.0",
    "SQLAlchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "dagster>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff==0.15.21",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
